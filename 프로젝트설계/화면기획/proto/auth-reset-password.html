<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1.5 비밀번호 변경 — money-log</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/ui.css">
</head>
<body>
<div class="layout-auth">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo">money-log</div>
      <p>비밀번호 변경</p>
    </div>

    <!-- 입력 단계 -->
    <div id="step-form">
      <p class="form-hint form-hint--block">아이디 <strong>hong</strong> · 비밀번호 찾기 확인 후 단계</p>
      <form id="form-reset" action="#" method="post">
        <div class="form-group">
          <label for="newPassword">새 비밀번호</label>
          <input class="input" id="newPassword" name="newPassword" type="password" value="NewPass1!" required>
          <p class="form-hint">8자 이상, 영·대·소·특수·숫자 중 3종류 이상</p>
        </div>
        <div class="form-group">
          <label for="newPasswordConfirm">새 비밀번호 확인</label>
          <input class="input" id="newPasswordConfirm" name="newPasswordConfirm" type="password" value="NewPass1!" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">변경</button>
      </form>
      <div class="auth-links">
        <a href="auth-login.html">로그인으로</a>
      </div>
    </div>

    <!-- 성공 후: 같은 카드에 안내 → 로그인으로 -->
    <div id="step-success" hidden>
      <div class="alert alert-info">
        비밀번호가 변경되었습니다.
        <p class="form-hint" style="margin:8px 0 0">잠시 후 로그인 화면으로 이동합니다.</p>
      </div>
      <a class="btn btn-primary btn-block" href="auth-login.html">로그인으로</a>
    </div>
  </div>
</div>
<script>
(function () {
  var form = document.getElementById("form-reset");
  var stepForm = document.getElementById("step-form");
  var stepSuccess = document.getElementById("step-success");
  var params = new URLSearchParams(location.search);
  // ?view=success : 캡처·검수용 (자동 이동 없음)
  if (params.get("view") === "success") {
    stepForm.hidden = true;
    stepSuccess.hidden = false;
    return;
  }
  if (!form) return;
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    stepForm.hidden = true;
    stepSuccess.hidden = false;
    setTimeout(function () {
      location.href = "auth-login.html";
    }, 2000);
  });
})();
</script>
</body>
</html>
