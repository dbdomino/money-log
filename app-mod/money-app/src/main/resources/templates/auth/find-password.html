<!DOCTYPE html>
<!--
  1.4 비밀번호 찾기. 007 의 로그인 전 껍데기를 쓴다.

  화면기획의 proto/auth-find-password.html 을 옮겼다. 예시 값을 걷어내고 폼을 화면 주소로
  보냈다.

  두 단계라는 것을 시작할 때 알린다. 확인만 하는 화면이라 비밀번호 칸이 없는데, 그 사실을
  적어 두지 않으면 사용자는 여기서 새 비밀번호를 정하려다 칸을 찾는다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth :: page('비밀번호 찾기', ~{::section})}">
<body>
<section>
  <p class="form-hint form-hint--block">
    아이디와 닉네임으로 본인을 확인한 뒤, 비밀번호 변경 화면으로 갑니다.
  </p>

  <div th:replace="~{fragments/form-error :: formTop}"></div>

  <form th:action="@{/auth/find-password}" method="post">
    <div class="form-group">
      <label for="memberId">아이디</label>
      <input class="input" id="memberId" name="memberId" type="text"
             th:value="${param.memberId}" required>
    </div>
    <div class="form-group">
      <label for="nickname">닉네임</label>
      <input class="input" id="nickname" name="nickname" type="text"
             th:value="${param.nickname}" required>
    </div>
    <button class="btn btn-primary btn-block" type="submit">확인</button>
  </form>

  <div class="auth-links">
    <a th:href="@{/auth/login}">로그인으로</a>
    <a th:href="@{/auth/find-id}">아이디 찾기</a>
  </div>
</section>
</body>
</html>
