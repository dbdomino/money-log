<!DOCTYPE html>
<!--
  1.3 아이디 찾기. 007 의 로그인 전 껍데기를 쓴다.

  화면기획의 proto/auth-find-id.html 을 옮겼다. 예시 결과와 "실제로는 서버에서 조회합니다"
  문구를 걷어내고, 결과 영역을 조회에 성공했을 때만 그리게 했다.

  결과 전용 주소를 만들지 않는다. 그 주소에 직접 들어온 사용자에게는 아무 맥락도 없는
  아이디가 보인다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth :: page('아이디 찾기', ~{::section})}">
<body>
<section>
  <div th:replace="~{fragments/form-error :: formTop}"></div>

  <form th:action="@{/auth/find-id}" method="post">
    <div class="form-group">
      <label for="email">가입 이메일</label>
      <input class="input" id="email" name="email" type="email"
             th:value="${param.email}" required>
      <span th:replace="~{fragments/form-error :: fieldError('email')}"></span>
    </div>
    <button class="btn btn-primary btn-block" type="submit">아이디 찾기</button>
  </form>

  <!-- 조회에 성공했을 때만 같은 화면에 나타난다. -->
  <div class="alert alert-info" style="margin-top:var(--space-4)" th:if="${foundMemberId != null}">
    찾은 아이디: <strong th:text="${foundMemberId}">hong</strong>
    <!-- 가려진 값이면 그 사실을 적는다. 적지 않으면 사용자는 가려진 값으로 로그인을 시도한다.
         가리는 판단은 백엔드가 하고 화면은 풀지 않는다. -->
    <p class="form-hint" style="margin:8px 0 0" th:if="${foundMasked}">
      보안을 위해 일부가 가려진 아이디입니다.
    </p>
  </div>

  <div class="auth-links">
    <a th:href="@{/auth/login}">로그인으로</a>
    <a th:href="@{/auth/find-password}">비밀번호 찾기</a>
  </div>
</section>
</body>
</html>
