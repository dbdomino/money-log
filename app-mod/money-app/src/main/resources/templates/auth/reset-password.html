<!DOCTYPE html>
<!--
  1.5 비밀번호 변경. 007 의 로그인 전 껍데기를 쓴다.

  화면기획의 proto/auth-reset-password.html 을 옮겼다. 프로토타입은 스크립트로 두 단계를
  오갔지만 여기서는 서버가 어느 단계인지 정한다 — 저장에 성공했는지는 서버만 안다.

  아이디·닉네임은 재설정 표식에서 와서 숨은 값으로 실린다. 사용자가 바꿔도 백엔드가 저장
  시점에 다시 대조하므로 남의 비밀번호를 바꿀 수 없다.

  완료 전용 주소를 만들지 않는다. 같은 카드에 완료를 보이고 「로그인으로」 버튼을 함께 둔다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/auth :: page('비밀번호 변경', ~{::section})}">
<body>
<section>

  <!-- 입력 단계. 저장에 성공하면 그리지 않는다. -->
  <div th:unless="${resetDone}">
    <p class="form-hint form-hint--block">
      아이디 <strong th:text="${resetMemberId}">hong</strong> · 본인 확인을 마친 단계입니다
    </p>

    <div th:replace="~{fragments/form-error :: formTop}"></div>

    <form th:action="@{/auth/reset-password}" method="post">
      <!-- 1.4 에서 확인한 값. 백엔드 저장 API 가 둘을 다시 요구한다. -->
      <input type="hidden" name="memberId" th:value="${resetMemberId}">
      <input type="hidden" name="nickname" th:value="${resetNickname}">

      <div class="form-group">
        <label for="newPassword">새 비밀번호</label>
        <input class="input" id="newPassword" name="newPassword" type="password"
               autocomplete="new-password" required>
        <p class="form-hint">8자 이상, 영어 대·소문자·특수문자·숫자 중 3종류 이상</p>
        <span th:replace="~{fragments/form-error :: fieldError('password')}"></span>
      </div>

      <div class="form-group">
        <label for="newPasswordConfirm">새 비밀번호 확인</label>
        <input class="input" id="newPasswordConfirm" name="newPasswordConfirm" type="password"
               autocomplete="new-password" required>
        <span th:replace="~{fragments/form-error :: fieldError('passwordConfirm')}"></span>
      </div>

      <button class="btn btn-primary btn-block" type="submit">변경</button>
    </form>

    <div class="auth-links"><a th:href="@{/auth/login}">로그인으로</a></div>
  </div>

  <!-- 완료 단계. 같은 카드에 그린다. -->
  <div th:if="${resetDone}">
    <div class="alert alert-info">
      비밀번호가 변경되었습니다.
      <p class="form-hint" style="margin:8px 0 0">잠시 후 로그인 화면으로 이동합니다.</p>
    </div>
    <!-- 자동 이동만 두면 그 이동이 막힌 환경에서 사용자가 갇힌다. 버튼을 함께 둔다. -->
    <a class="btn btn-primary btn-block" th:href="@{/auth/login}">로그인으로</a>
    <meta http-equiv="refresh" th:content="'2; url=' + @{/auth/login}">
  </div>

</section>
</body>
</html>
