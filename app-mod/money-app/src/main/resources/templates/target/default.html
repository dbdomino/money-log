<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko"
      th:replace="~{layout/main :: layout(~{::title}, ~{::section}, ${activeMenu}, ${isAdmin})}">
<head><title>목표금액 (기본) · Money Log</title></head>
<section>
    <div th:replace="~{fragments/wireframe :: page-header('기본 목표금액', '지출유형별 기본 목표 (0 ~ 1억 원)')}"></div>
    <div th:replace="~{fragments/wireframe :: wireframe-note('미사용(비활성) 지출유형은 입력란 비활성화 또는 숨김. 월별 목표는 통계 화면에서 설정.')}"></div>

    <div class="card">
        <div class="table-responsive">
            <table class="table placeholder-table mb-0">
                <thead class="table-light">
                <tr>
                    <th>지출유형</th>
                    <th>사용</th>
                    <th style="width: 220px">기본 목표금액</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td><span class="icon-preview me-2" style="width:28px;height:28px">I</span>외식</td>
                    <td>사용</td>
                    <td><input type="number" class="form-control form-control-sm" value="300000"></td>
                </tr>
                <tr>
                    <td><span class="icon-preview me-2" style="width:28px;height:28px">I</span>교통</td>
                    <td>사용</td>
                    <td><input type="number" class="form-control form-control-sm" value="150000"></td>
                </tr>
                <tr class="table-secondary">
                    <td><span class="icon-preview me-2" style="width:28px;height:28px">I</span>취미</td>
                    <td>미사용</td>
                    <td><input type="number" class="form-control form-control-sm" disabled></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-body">
            <button type="button" class="btn btn-primary">저장</button>
        </div>
    </div>
</section>
</html>
