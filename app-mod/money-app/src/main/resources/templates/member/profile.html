<!DOCTYPE html>
<!--
  1.7 본인 정보. 007 의 로그인 후 껍데기를 쓴다.

  화면기획의 proto/member-profile.html 을 옮겼다. 예시 문구와 회원이 만들어진 때를 적은 줄을
  걷어냈다 — 백엔드 응답에 그 값이 없다.

  아이디는 읽기 전용이다. 백엔드 수정 API 에 아이디를 바꾸는 칸 자체가 없고, 화면은 그 사실을
  사용자에게 보여 줄 뿐이다.

  새 비밀번호 칸은 언제나 빈 채로 뜨고 "변경할 때만 입력"을 함께 적는다. 비어 있는 것이
  정상 상태라는 것을 사용자가 알아야 한다.

  다시 그릴 때의 값:
    저장에 실패했으면 사용자가 방금 친 값(요청 파라미터)을 되채운다 — 되받은 값으로 덮으면
    고친 내용이 사라진다. 그 밖에는 백엔드가 준 현재 값을 그린다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: page('본인 정보', ~{::section})}">
<body>
<section th:with="editing=${failMessage != null}">
  <div class="page-header"><h1>본인 정보</h1></div>

  <div class="panel panel--narrow">
    <div class="alert alert-info" th:if="${saved}" role="status">저장되었습니다.</div>

    <div th:replace="~{fragments/form-error :: formTop}"></div>

    <form th:action="@{/member/profile}" method="post">
      <div class="form-group">
        <label for="memberId">아이디</label>
        <!-- disabled 가 아니라 readonly 다. disabled 는 값을 함께 보내지 않아, 뒤에 이 칸이
             필요해졌을 때 원인을 찾기 어려운 누락이 된다. -->
        <input class="input" id="memberId" type="text" readonly
               th:value="${profile.memberId()}">
      </div>

      <div class="form-group">
        <label for="nickname">닉네임</label>
        <input class="input" id="nickname" name="nickname" type="text" required
               th:value="${editing} ? ${param.nickname} : ${profile.nickname()}">
      </div>

      <div class="form-group">
        <label for="email">이메일</label>
        <input class="input" id="email" name="email" type="email"
               th:value="${editing} ? ${param.email} : ${profile.email()}">
        <p class="form-hint">비우고 저장하면 이메일이 지워집니다</p>
        <span th:replace="~{fragments/form-error :: fieldError('email')}"></span>
      </div>

      <div class="form-group">
        <label for="phone">폰</label>
        <input class="input" id="phone" name="phone" type="tel" inputmode="numeric"
               th:value="${editing} ? ${param.phone} : ${profile.phone()}">
        <p class="form-hint">하이픈을 넣어도 됩니다. 숫자만 저장되고, 비우면 지워집니다</p>
      </div>

      <div class="form-group">
        <label for="intro">소개</label>
        <textarea class="textarea" id="intro" name="intro"
                  th:text="${editing} ? ${param.intro} : ${profile.intro()}"></textarea>
        <p class="form-hint">비우고 저장하면 소개가 지워집니다</p>
      </div>

      <div class="form-group">
        <label for="newPassword">새 비밀번호</label>
        <!-- th:value 를 두지 않는다. 실패로 다시 그릴 때도 비운다. -->
        <input class="input" id="newPassword" name="newPassword" type="password"
               autocomplete="new-password" placeholder="변경할 때만 입력">
        <p class="form-hint">변경할 때만 입력하세요. 비워 두면 비밀번호는 그대로입니다</p>
        <p class="form-hint">8자 이상, 영어 대·소문자·특수문자·숫자 중 3종류 이상</p>
        <span th:replace="~{fragments/form-error :: fieldError('password')}"></span>
      </div>

      <button type="submit" class="btn btn-primary">저장</button>
    </form>
  </div>
</section>
</body>
</html>
