<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  월별 고정지출 내역(4.6)에서 「직접 고친 행」을 표시하는 조각.

  왜 009 의 status-badge 를 쓰지 않았나 — 두 가지가 맞지 않는다.

    · 009 의 조각은 둘 다 양쪽 분기에 색을 붙인다(사용/사용 안 함 · 정상/삭제됨).
      「수정됨」은 고친 행에만 붙고 나머지 행에는 아무것도 붙지 않는다 —
      양쪽에 다 말이 붙으면 표에서 눈에 띄어야 할 대비가 사라진다.

    · 색 규칙이 다르다. 「삭제됨」은 되돌릴 수 없어 위험을 알리는 색을 썼는데,
      「수정됨」은 반영으로 다시 설정 값이 될 수 있는 되돌릴 수 있는 표시다.
      위험 색도, 좋고 나쁨을 말하는 색도 쓰지 않고 중립 회색을 쓴다.

  009 의 조각을 고치지는 않았다. 그쪽에 분기를 더하면 두 화면이 서로의 사정을
  들고 있게 된다.

  이 표시가 반영의 전제다. 구분이 없으면 「고정지출 반영」을 누를 때 무엇이
  보존되는지 알 수 없고, 「직접 수정분도 되돌리기」가 무엇을 되돌리는지도
  이해되지 않는다.

  쓰는 쪽:
    <td><span th:replace="~{fragments/modified-badge :: modified(${row.isModified()})}"></span></td>
-->
<th:block th:fragment="modified(flag)">
  <span class="badge badge-muted" th:if="${flag}">수정됨</span>
</th:block>
</body>
</html>
