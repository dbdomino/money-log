<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  서버가 정한 "열 모달"을 007 의 모달 스크립트에 넘기는 조각.

  007 의 스크립트는 주소의 ?m= 를 읽어 스스로 연다. 그런데 모달 제출이 실패해 다시 그린
  경우에는 주소에 그 값이 없다 — 서버는 어느 모달인지 알고 있지만 브라우저는 모른다.
  그 판정을 표시로 실어 넘긴다.

  007 의 공개 API 를 부르는 것이라 공통 코드를 고치지 않는다. 주소로 들어온 경우 007 의
  딥링크 처리와 겹쳐 두 번 열릴 수 있지만, 여는 동작은 여러 번 해도 결과가 같다.

  008 이 관리자 회원 화면에 인라인으로 넣어 두었던 것을 여기로 뽑았다. 009 가 화면 둘을
  더하고 010~012 가 넷을 더 얹으므로, 뽑지 않으면 같은 스크립트가 여섯 벌이 된다.

  쓰는 쪽 (모달을 가진 화면의 본문 끝):
    <th:block th:replace="~{fragments/modal-open :: opener}"></th:block>

  전제: 화면이 모델에 openModal(열 모달 값)과 modalMap(값 → 화면 안 식별자)을 담는다.
-->
<th:block th:fragment="opener">
  <span id="open-modal-marker" hidden th:if="${openModal != null}"
        th:attr="data-open-modal=${openModal}"></span>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var marker = document.getElementById("open-modal-marker");
      var mapAttr = document.body.getAttribute("data-modal-map");
      if (!marker || !mapAttr || !window.MoneyLogModal) return;
      try {
        var id = JSON.parse(mapAttr)[marker.getAttribute("data-open-modal")];
        if (id) window.MoneyLogModal.open(id);
      } catch (e) {
        /* 지도가 깨졌으면 모달만 열리지 않는다. 목록은 그대로 보인다 */
      }
    });
  </script>
</th:block>
</body>
</html>
