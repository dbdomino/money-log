<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  확인 다이얼로그. 삭제·회원 정지·할부 중도상환이 이 하나를 공용으로 쓴다.

  화면마다 자체 다이얼로그를 만들거나 브라우저 기본 확인창을 쓰지 않는다. 같은 성격의 확인이
  화면마다 다르게 보이면 사용자가 무엇이 위험한 동작인지 배우지 못한다.

  본문 문구는 부르는 쪽이 넘긴다. 다이얼로그가 문구를 만들지 않는 이유는 되돌릴 수 없는
  범위를 아는 쪽이 화면이기 때문이다 — 고정지출을 지우면 월별 내역까지 사라지는데, 그 사실은
  그 화면만 안다.

  쓰는 쪽:
    <div th:replace="~{fragments/confirm-dialog :: confirmDialog(
            'confirm-payment-delete', '수단 삭제',
            '지우면 되돌릴 수 없습니다. 과거 내역의 수단 이름은 남습니다.',
            '삭제', @{/payments/1/delete})}"></div>
-->
<div class="modal-root" th:fragment="confirmDialog(id, title, body, confirmLabel, action)"
     th:id="${id}" aria-hidden="true" role="dialog" th:aria-labelledby="${id} + '-title'">

  <div class="modal-backdrop" data-modal-close></div>

  <div class="modal-panel">
    <div class="modal-header">
      <h2 th:id="${id} + '-title'" th:text="${title}">확인</h2>
      <button type="button" class="modal-close" data-modal-close aria-label="닫기">&times;</button>
    </div>

    <div class="modal-body">
      <p th:text="${body}">정말 진행할까요?</p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-modal-close>취소</button>
      <!-- 되돌릴 수 없는 동작이라 POST 로 보낸다. 링크로 두면 브라우저가 미리 불러오는
           것만으로 실행된다. -->
      <form th:action="${action}" method="post" style="display:inline">
        <button type="submit" class="btn btn-danger" th:text="${confirmLabel}">확인</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
