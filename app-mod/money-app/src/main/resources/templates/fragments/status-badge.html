<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  목록의 상태 뱃지 조각 둘. 수단(2.1)과 지출유형(2.5)이 함께 쓴다.

  inUse  : 「사용」 · 「사용 안 함」  — 되돌릴 수 있는 상태
  deleted: 「정상」 · 「삭제됨」      — 되돌릴 수 없는 상태

  한 조각에 합치지 않는다. 둘 다 "지금 고를 수 없다"로 보이지만 하나는 되돌아오고 하나는
  아니다. 합치면 사용자가 그 차이를 알 수 없고, 되돌릴 수 없는 일을 가볍게 누른다.

  두 화면이 같은 조각을 쓰는 이유는 같은 말과 같은 색을 쓰기 위해서다 — 화면마다 다른 말을
  쓰면 사용자가 같은 상태를 다른 것으로 읽는다.

  쓰는 쪽:
    <td><span th:replace="~{fragments/status-badge :: inUse(${item.inUseLabel()}, ${item.inUse()})}"></span></td>
    <td><span th:replace="~{fragments/status-badge :: deleted(${item.statusLabel()}, ${item.isDeleted()})}"></span></td>
-->

<!-- 사용 여부. 끈 것은 되돌릴 수 있으므로 위험을 알리는 색을 쓰지 않는다. -->
<span class="badge" th:fragment="inUse(label, active)"
      th:classappend="${active} ? 'badge-success' : 'badge-warning'"
      th:text="${label}">사용</span>

<!-- 삭제 여부. 되돌릴 수 없으므로 위험을 알리는 색을 쓴다. -->
<span class="badge" th:fragment="deleted(label, removed)"
      th:classappend="${removed} ? 'badge-danger' : 'badge-success'"
      th:text="${label}">정상</span>
</body>
</html>
