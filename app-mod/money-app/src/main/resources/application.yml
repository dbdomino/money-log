# 화면 모듈(money-app) 설정.
#
# datasource·JPA·MyBatis 설정이 한 줄도 없는 것이 정상이다. 헌장 원칙 I 에 따라 이 모듈은
# DB 를 모르고, 데이터는 전부 백엔드 API(:8081) 호출로 얻는다. DB 프로필(postgresql)을
# 타지 않으므로 data-mod 의 datasource 설정도 끌어오지 않는다.
spring:
  application:
    name: money-app

  servlet:
    multipart:
      # 아이콘 업로드(009)와 엑셀 일괄 등록(010)이 폼으로 들어온다. 화면이 파일을 받아
      # 백엔드로 중계하므로 이 설정은 그대로 둔다.
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html

server:
  servlet:
    session:
      # 30분. 단위를 반드시 붙인다 — 값만 적으면 초로 읽혀 60 이 1분이 된다.
      # Access 토큰이 1일인데 화면 세션이 1분이면 사용자에게는 "1분마다 재로그인"으로
      # 관측되고, Access 만료 재발급 흐름은 세션이 먼저 죽어 한 번도 일어나지 않는다.
      timeout: 30m
      # 세션 식별자를 쿠키로만 추적한다. URL 에 붙으면 주소창과 Referer 로 새어 나간다.
      tracking-modes: cookie
  error:
    # 화면 모듈은 오류도 화면으로 답한다. 기본 흰 페이지 대신 templates/error.html 이 뜬다.
    whitelabel:
      enabled: false
    include-exception: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# 백엔드 API 연동. 주소를 코드에 적지 않는다 — 배포 환경이 바뀌면 여기만 고친다.
moneylog:
  backend:
    base-url: http://localhost:8081/api/v1
    # 연결 타임아웃. 초과하면 "서버에 닿지 못했습니다"로 화면에 표시한다.
    connect-timeout: 3s
    # 읽기 타임아웃. 엑셀 일괄 등록(010)이 가장 오래 걸린다.
    read-timeout: 10s

logging:
  level:
    com.dbdomino.moneylog: info
    org.springframework: warn
