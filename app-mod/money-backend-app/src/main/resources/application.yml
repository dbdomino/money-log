# datasource / jpa 설정은 data-mod/src/main/resources/application-postgresql.yml 이 소유한다.
#
# 여기에 spring.jpa.* 를 적지 않는다 — 적어도 조용히 무시된다(2026-09-02 확인).
# Spring Boot 는 프로필 전용 문서(application-postgresql.yml)를 평범한 문서(이 파일)보다
# 나중에 적용하며, 파일이 어느 모듈에 있는지는 우선순위와 무관하다. 실제로 이 파일에
# format_sql: false 를 넣고 기동해도 data-mod 의 true 가 그대로 적용됐다. 오류도 경고도
# 없어서 "고쳤는데 왜 안 먹지"로 시간을 잃기 쉽다.
#
# ddl-auto·default_schema·show_sql·HikariCP 를 바꾸려면 위 data-mod 파일을 고친다.
# 그 파일은 data-mod 의 스키마 검증 테스트(@ActiveProfiles("postgresql"))도 함께 쓰므로,
# 바꾸면 :data-mod:test 에도 그대로 반영된다.
#
# 이 파일에 두는 것: 프로필 스위치, 포트, 로깅 레벨.
spring:
  profiles:
    active: postgresql
  application:
    name: money-backend-app
  servlet:
    multipart:
      # 업로드를 받는 API 가 둘이다 — 003 의 아이콘(2.7·2.11)과 004 의 엑셀(3.12).
      # 한도는 둘 중 큰 쪽인 엑셀에 맞춘다.
      #
      # **이 값을 올려도 아이콘의 1MB 판정은 그대로다.** 아이콘은 서블릿이 아니라
      # 애플리케이션(ExpendGroupIconService)이 icon.storage.max-file-size 로 좁히므로,
      # 1MB 를 넘는 아이콘은 Controller 까지 들어와 3102 로 거절된다(003 SC-211 유지).
      # 서블릿 한도가 아이콘의 방어선이라고 읽으면 안 된다.
      #
      # 엑셀도 실제 방어선은 여기가 아니라 애플리케이션의 300행 판정(FR-319)이다.
      # 300행짜리 .xlsx 는 수십 KB 라 10MB 는 넉넉한 상한이고, 여기서 걸리는 것은
      # 사실상 "엑셀이 아닌 거대한 파일"뿐이다.
      max-file-size: 10MB
      # 요청 전체 한도. 파일 1개 + 폼 필드 몇 개라 파일 한도보다 조금만 크면 된다.
      max-request-size: 12MB

server:
  port: 8081

# JWT. 상세는 specs/002-backend-member-auth/contracts/auth-pipeline.md §6.
#
# secret 은 기본값을 두지 않는다 — 주입을 잊어도 기동이 성공하면 알려진 키가 그대로
# 운영에 나간다. HS256 이라 256비트(32바이트) 이상이어야 하고, 그 검증은 JwtProperties 가
# 기동 시점에 한다. 로컬 기동: JWT_SECRET 환경변수를 넣고 bootRun.
# 테스트는 이 값을 요구하지 않는다 — AbstractApiIT 가 @SpringBootTest properties 로 싣는다.
jwt:
  secret: ${JWT_SECRET}
  access-token-validity-seconds: 86400    # 1일
  refresh-token-validity-seconds: 604800  # 7일

# 지출유형 아이콘의 회원별 복사본을 두는 디렉터리.
#
# 기본값을 두지 않는다 — 빠뜨린 채 기동하면 임시 디렉터리 같은 곳에 파일이 쌓이고
# 재기동하면 사라지는 사고가 조용히 난다. 클래스패스 안(resources/)을 가리킬 수도 없다:
# 배포하면 jar 내부가 되어 쓸 수 없다. 시드 원본만 읽기 전용으로 클래스패스에 있다.
icon:
  storage:
    dir: ${ICON_STORAGE_DIR}
    # 업로드 아이콘의 최대 크기(FR-219). 위 spring.servlet.multipart.max-file-size 와
    # 같은 값이어야 한다 — 서블릿이 먼저 막고 애플리케이션이 한 번 더 확인하는 구조라,
    # 두 값이 어긋나면 어느 한쪽만 통과하는 크기 구간이 생긴다.
    max-file-size: 1MB

# Swagger UI 와 OpenAPI 문서. 실행 중인 앱에서 API 를 확인·호출하기 위한 것이다.
#
#   Swagger UI   http://localhost:8081/swagger-ui.html
#   OpenAPI JSON http://localhost:8081/v3/api-docs
#   OpenAPI YAML http://localhost:8081/v3/api-docs.yaml
#
# **운영에서는 끈다.** 두 enabled 를 false 로 두면 경로가 404 가 되므로 SecurityConfig 의
# permitAll 이 남아 있어도 노출되지 않는다 — 경로를 지우는 것보다 이쪽이 안전하다.
# 여기 값을 지우지 말고 배포 프로필에서 덮어쓴다.
#
# 이 문서는 코드에서 만들어지므로 컨트롤러·DTO 가 바뀌면 따라 바뀐다. 사람이 쓴
# 계약 문서(app-mod/money-backend-app/openapi.yaml)와 역할이 다르다 — docs/API-문서.md 참고.
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    # 태그(자원)와 메서드를 이름순으로 세운다. 기본값은 컨트롤러 등록 순서라 기동할 때마다
    # 흔들릴 수 있어 "어제 보던 자리"에 없다.
    tags-sorter: alpha
    operations-sorter: alpha
    # 응답 예시를 접어 둔다. 37개 API 가 전부 펼쳐져 있으면 목록을 훑을 수 없다.
    doc-expansion: none
    # 요청 기간(Duration)을 응답에 표시해 느린 호출을 눈으로 잡는다.
    display-request-duration: true
  # 문서에 담을 경로. 액추에이터·에러 경로가 섞이지 않게 /api/v1 만 훑는다.
  paths-to-match: /api/v1/**

# common-mod 의 웹 공용 빈(GlobalExceptionHandler·ApiLoggingAspect) 활성화 스위치.
#
# 두 빈은 common-mod 에 있고 money-app(프론트)도 common-mod 를 의존한다. 프론트의
# 컴포넌트 스캔 범위가 com.dbdomino.moneylog 전체라 조건이 없으면 프론트에도 자동
# 등록되어 기존 ControllerExceptionHandler 와 advice 두 개가 공존한다. 백엔드에서만 켠다.
moneylog:
  common:
    web:
      enabled: true

logging:
  level:
    org:
      hibernate:
        # SQL 문만 남긴다. 바인딩 값 로깅(org.hibernate.orm.jdbc.bind)은 켜지 않는다 —
        # 켜면 bcrypt 해시와 토큰 해시가 그대로 로그 파일에 쌓인다(SC-111).
        SQL: debug
      springframework:
        jdbc: info
    com:
      dbdomino:
        moneylog: info
